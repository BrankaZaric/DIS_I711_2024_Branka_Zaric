name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write  # Needed for creating and pushing tags
  packages: write  # Needed for Docker images (if using GHCR)
  actions: read

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: -Xmx1024m

jobs:
  # ============================================
  # BUILD JOB - Compile all services
  # ============================================
  build:
    name: Build All Services
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      run: mvn clean compile -DskipTests

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

  # ============================================
  # TEST JOB - Run all tests
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        service:
          - eureka-server
          - config-server
          - api-gateway
          - product-service
          - order-service

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Run tests for ${{ matrix.service }}
      run: |
        cd ${{ matrix.service }}
        mvn test

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.service }}
        path: ${{ matrix.service }}/target/surefire-reports/

    - name: Generate test coverage report
      if: matrix.service == 'product-service' || matrix.service == 'order-service'
      run: |
        cd ${{ matrix.service }}
        mvn jacoco:report

    - name: Upload coverage report
      if: matrix.service == 'product-service' || matrix.service == 'order-service'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.service }}
        path: ${{ matrix.service }}/target/site/jacoco/

  # ============================================
  # INTEGRATION TEST JOB - Test service communication
  # ============================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres-product:
        image: postgres:15
        env:
          POSTGRES_DB: productdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-order:
        image: postgres:15
        env:
          POSTGRES_DB: orderdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Run integration tests
      run: |
        mvn verify -Pintegration-tests

  # ============================================
  # PACKAGE JOB - Create Docker images
  # ============================================
  package:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    strategy:
      matrix:
        service:
          - eureka-server
          - config-server
          - api-gateway
          - product-service
          - order-service

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        cache: 'maven'

    - name: Build JAR
      run: |
        cd ${{ matrix.service }}
        mvn clean package -DskipTests

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        cd ${{ matrix.service }}
        docker build -t ${{ matrix.service }}:${{ github.sha }} .
        docker tag ${{ matrix.service }}:${{ github.sha }} ${{ matrix.service }}:latest

    - name: Save Docker image
      run: |
        docker save ${{ matrix.service }}:latest | gzip > ${{ matrix.service }}.tar.gz

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-${{ matrix.service }}
        path: ${{ matrix.service }}.tar.gz

  # ============================================
  # DEPLOY TO DEVELOPMENT
  # ============================================
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: development
      url: http://dev.yourapp.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all Docker images
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Deploy to Development
      run: |
        echo "Deploying to Development environment..."
        # Add your deployment commands here
        # Example: kubectl apply -f k8s/dev/
        # Example: docker-compose -f docker-compose.dev.yml up -d
        echo "Development deployment completed!"

  # ============================================
  # DEPLOY TO STAGING
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: http://staging.yourapp.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all Docker images
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Deploy to Staging
      run: |
        echo "Deploying to Staging environment..."
        # Add your deployment commands here
        echo "Staging deployment completed!"

  # ============================================
  # DEPLOY TO PRODUCTION (Manual approval required)
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: http://yourapp.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Needed for creating tags and pushing

    - name: Download all Docker images
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Deploy to Production
      run: |
        echo "Deploying to Production environment..."
        # Add your production deployment commands here
        # Example: kubectl apply -f k8s/prod/
        echo "Production deployment completed!"

    - name: Create Release Tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a v${{ github.run_number }} -m "Release v${{ github.run_number }}"
        git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git v${{ github.run_number }}