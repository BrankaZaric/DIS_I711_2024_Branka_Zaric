spring:
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never  # Disable data.sql during tests

jwt:
  secret: testSecretKeyForJWT1234567890123456789012345678901234567890
  expiration: 86400000

server:
  port: 0

eureka:
  client:
    enabled: false